name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run Tests
        run: nix develop --command cargo test

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs on pull requests created with the default GITHUB_TOKEN wait for approval,
      # so the release PR is created as the GitHub App instead.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  build:
    # Builds on every run, so a broken binary shows up before a release; uploads on releases.
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Plain cargo, not Nix: the binaries must not depend on /nix/store
      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the binary runs on its own
        run: |
          bin=target/${{ matrix.target }}/release/tmux-layout
          file "$bin"
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L "$bin"
            ! otool -L "$bin" | grep -q /nix/store
          else
            file "$bin" | grep -Eq 'static(ally|-pie)? linked'
          fi
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) ;; # cross-compiled; the arm64 runner can't always run it
            *) "$bin" --version ;;
          esac

      - name: Prepare Release Assets
        if: ${{ needs.release.outputs.release_created }}
        run: |
          mkdir -p release && install -m 0755 target/${{ matrix.target }}/release/tmux-layout release/tmux-layout-${{ matrix.target }}

      - name: Upload Release Assets
        if: ${{ needs.release.outputs.release_created }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: release/tmux-layout-${{ matrix.target }}
